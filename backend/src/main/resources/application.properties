# Port: Render (and most PaaS hosts) inject $PORT; 8080 everywhere else.
server.port=${PORT:8080}

# Database. Default: H2 file DB under ./data (local dev + home server).
# Hosted (Neon Postgres): set SPRING_DATASOURCE_URL to the Neon JDBC string, e.g.
#   jdbc:postgresql://<host>/<db>?user=<u>&password=<p>&sslmode=require
# Driver is inferred from the JDBC URL (H2 vs Postgres).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/ipomanager;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
# SECURITY: keep SQL logging off — KYC fields must never appear in logs.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN

# CORS: comma-separated list of allowed origins.
# For production (GitHub Pages frontend), set e.g.:
#   app.cors.allowed-origins=https://<your-username>.github.io
app.cors.allowed-origins=http://localhost:5173
