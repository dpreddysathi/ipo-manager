server.port=8080

# H2 file-based database, stored under ./data relative to the working directory.
spring.datasource.url=jdbc:h2:file:./data/ipomanager;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
# SECURITY: keep SQL logging off — KYC fields must never appear in logs.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN

# CORS: comma-separated list of allowed origins.
# For production (GitHub Pages frontend), set e.g.:
#   app.cors.allowed-origins=https://<your-username>.github.io
app.cors.allowed-origins=http://localhost:5173
